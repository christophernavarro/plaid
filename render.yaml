services:
  - type: web
    name: bluemax-plaid
    runtime: node
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Contador
      - key: PLAID_WEBHOOK_URL
        sync: false
