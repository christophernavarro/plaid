<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluemaxp - Contador</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg:#f4f1ea; --ink:#1c1b18; --muted:#7c766a; --line:#e7e0d0; --panel:#fbf9f3;
      --accent:#1f3a52; --accent2:#2b5578; --pos:#2f6d4f; --neg:#b0553f; --pend:#9a7b2e;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Archivo',system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    .serif { font-family:'Newsreader',Georgia,serif; }
    .hidden { display:none !important; }
    a { color:var(--accent); } a:hover { color:#142838; }
    .wrap { max-width:940px; margin:0 auto; padding:34px 22px 60px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .spread { justify-content:space-between; }
    .muted { color:var(--muted); font-size:13px; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }

    .logo-mark { display:block; flex:none; }
    .brandlock { display:flex; align-items:flex-end; gap:8px; }
    .brandlock .name { font-family:'Newsreader',serif; font-size:23px; font-weight:600; letter-spacing:-0.02em; line-height:1; }
    .tag { font-size:12px; color:var(--accent); background:#e9eef3; border-radius:999px; padding:3px 11px; font-weight:600; align-self:center; }

    .btn-primary { background:linear-gradient(180deg,#2b5578,#1f3a52); color:#f4f1ea; border:none; border-radius:11px; padding:11px 20px; font:600 14px 'Archivo',sans-serif; cursor:pointer;
      box-shadow:0 6px 16px rgba(31,58,82,.28), inset 0 1px 0 rgba(255,255,255,.16); transition:transform .15s, box-shadow .15s, filter .15s; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary:hover { transform:translateY(-1px); filter:brightness(1.07); box-shadow:0 10px 22px rgba(31,58,82,.34); }
    .btn-ghost { background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 15px; font:500 13px 'Archivo',sans-serif; cursor:pointer; color:var(--ink); transition:border-color .15s, box-shadow .15s, transform .15s; display:inline-flex; align-items:center; gap:7px; }
    .btn-ghost:hover { border-color:#cfc6b2; box-shadow:0 4px 12px rgba(28,27,24,.06); transform:translateY(-1px); }
    .btn-link { background:none; border:none; color:var(--accent); padding:0; cursor:pointer; font:14px 'Archivo',sans-serif; text-decoration:underline; }

    .field { padding:11px 13px; font-size:14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:'Archivo',sans-serif; box-shadow:inset 0 1px 2px rgba(28,27,24,.04); transition:border-color .15s, box-shadow .15s; }
    .field:focus { outline:none; border-color:#9db4c8; box-shadow:0 0 0 3px rgba(31,58,82,.12); }
    .search { width:100%; padding:13px 14px 13px 42px; }

    .card { background:linear-gradient(180deg,#fbf9f3,#f5f1e8); border:1px solid #ece5d5; border-radius:14px; box-shadow:0 1px 2px rgba(28,27,24,.04), 0 12px 30px rgba(28,27,24,.05); }
    .user-card { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; margin-top:12px; }
    .av { width:38px; height:38px; border-radius:50%; background:linear-gradient(145deg,#eaf0f5,#dbe5ef); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; box-shadow:inset 0 1px 0 rgba(255,255,255,.7); flex:none; }
    .av.dark { background:linear-gradient(145deg,#2b5578,#183048); color:#f4f1ea; }
    .badge { font-size:12px; padding:3px 11px; border-radius:999px; font-weight:600; }
    .badge.ok { background:#e3ede7; color:var(--pos); box-shadow:inset 0 0 0 1px rgba(47,109,79,.16); }
    .badge.pend { background:#f3ead2; color:var(--pend); box-shadow:inset 0 0 0 1px rgba(154,123,46,.18); }

    .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-top:22px; }
    .tile { padding:14px 16px; }
    .tile .label { font-size:12px; color:var(--muted); }
    .tile .value { font-family:'Newsreader',serif; font-size:26px; font-weight:600; margin-top:4px; }
    .tile .value.deb { color:var(--neg); } .tile .value.cred { color:var(--pos); }

    .panel { background:linear-gradient(180deg,#fbf9f3,#f6f2e9); border:1px solid #ece5d5; border-radius:14px; padding:6px 16px; margin-top:12px; box-shadow:0 1px 2px rgba(28,27,24,.04), 0 12px 30px rgba(28,27,24,.05); }
    .panel.msg { padding:16px; color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:12px 8px; font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    td { padding:12px 8px; border-top:1px solid var(--line); font-size:14px; }
    .debito { color:var(--neg); } .credito { color:var(--pos); }
    .sectitle { font-family:'Newsreader',serif; font-size:20px; font-weight:600; margin:32px 0 0; }
    .head { display:flex; align-items:center; gap:14px; margin-top:14px; }
    .filtros { margin-top:12px; gap:10px; }
    .filtros label { font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ================= LISTA DE USUARIOS ================= -->
    <section id="screen-usuarios" class="hidden">
      <div class="row spread">
        <div class="brandlock">
          <svg class="logo-mark" width="27" height="24" viewBox="0 0 24 24" fill="#1f3a52"><rect x="2" y="13" width="4.6" height="8" rx="2.3"/><rect x="9.7" y="8" width="4.6" height="13" rx="2.3"/><rect x="17.4" y="3" width="4.6" height="18" rx="2.3"/></svg>
          <span class="name">Bluema<span style="color:var(--accent);">x</span>p</span>
          <span class="tag">Contador</span>
        </div>
        <button class="btn-ghost" id="logout-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Salir</button>
      </div>

      <div style="margin-top:30px;">
        <div style="font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);">Cartera de clientes</div>
        <h1 class="serif" style="font-size:38px; font-weight:500; margin:8px 0 0; letter-spacing:-0.02em;">Usuarios</h1>
      </div>

      <div style="position:relative; margin-top:20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="position:absolute; left:14px; top:14px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="field search" id="buscador" placeholder="Buscar usuario por nombre o email...">
      </div>
      <div id="usuarios-lista"></div>
    </section>

    <!-- ================= DETALLE ================= -->
    <section id="screen-detalle" class="hidden">
      <button class="btn-link" id="volver-btn">&larr; Volver a usuarios</button>
      <div class="head">
        <span class="av dark" id="detalle-avatar" style="width:52px; height:52px; font-size:22px;"></span>
        <div>
          <h1 class="serif" id="detalle-nombre" style="font-size:30px; font-weight:500; margin:0; letter-spacing:-0.01em;"></h1>
          <div class="muted" id="detalle-sub"></div>
        </div>
      </div>
      <div class="muted" id="detalle-estado" style="margin-top:8px;"></div>
      <button class="btn-ghost" id="refresh-btn" style="margin-top:14px;">Actualizar datos</button>

      <div id="tiles" class="tiles hidden"></div>

      <h3 class="sectitle">Cuentas</h3>
      <div id="cuentas-box" class="panel msg">Sin datos todavia.</div>

      <h3 class="sectitle">Movimientos</h3>
      <div class="row filtros">
        <label>Desde <input class="field" type="date" id="f-desde"></label>
        <label>Hasta <input class="field" type="date" id="f-hasta"></label>
        <button class="btn-ghost" id="aplicar-btn">Aplicar</button>
        <button class="btn-ghost" id="limpiar-btn">Limpiar</button>
        <button class="btn-primary" id="exportar-btn" style="margin-left:auto;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Exportar CSV</button>
      </div>
      <div id="tx-box" class="panel msg">Sin datos todavia.</div>
    </section>

  </div>

  <script>
    let token = localStorage.getItem('adminToken') || null;
    let usuarioActual = null;
    let nombreActual = '';
    let pollTimer = null;
    let datos = { accounts: [], transactions: [] };

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n == null ? '-' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

    function show(screen) {
      ['screen-usuarios', 'screen-detalle'].forEach((s) => $(s).classList.add('hidden'));
      $(screen).classList.remove('hidden');
    }

    // Si no hay sesion de contador, volvemos al login unico.
    function alLogin() {
      token = null; localStorage.removeItem('adminToken');
      window.location.href = '/';
    }

    async function api(path, opts = {}) {
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(path, opts);
      return res.json();
    }

    $('logout-btn').addEventListener('click', alLogin);

    // ---------- Lista de usuarios ----------
    async function irAUsuarios() {
      if (pollTimer) clearInterval(pollTimer);
      show('screen-usuarios');
      buscarUsuarios();
    }

    let debounce = null;
    $('buscador').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(buscarUsuarios, 250); });

    async function buscarUsuarios() {
      const q = encodeURIComponent($('buscador').value.trim());
      const data = await api('/api/admin/usuarios?q=' + q);
      if (data.error) { alLogin(); return; }
      const cont = $('usuarios-lista');
      cont.innerHTML = '';
      if (!data.usuarios.length) {
        cont.innerHTML = '<p class="muted" style="margin-top:16px;">No hay usuarios que coincidan.</p>';
        return;
      }
      data.usuarios.forEach((u) => {
        const div = document.createElement('div');
        div.className = 'card user-card';
        const badge = u.conectado ? '<span class="badge ok">Conectado</span>' : '<span class="badge pend">Sin banco</span>';
        const inicial = (u.nombre[0] || '?').toUpperCase();
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="av">${inicial}</span>
            <div>
              <div style="font-weight:600;">${u.nombre} ${badge}</div>
              <div class="muted">${u.email} &middot; ${u.cantidadCuentas} cuentas &middot; ${u.cantidadTransacciones} movimientos</div>
            </div>
          </div>
          <button class="btn-ghost">Ver &rarr;</button>
        `;
        div.querySelector('button').addEventListener('click', () => verUsuario(u.id, u.nombre, u.email));
        cont.appendChild(div);
      });
    }

    // ---------- Detalle ----------
    async function verUsuario(id, nombre, email) {
      usuarioActual = id; nombreActual = nombre;
      show('screen-detalle');
      $('detalle-nombre').textContent = nombre;
      $('detalle-sub').textContent = email || '';
      $('detalle-avatar').textContent = (nombre[0] || '?').toUpperCase();
      $('detalle-estado').textContent = '';
      $('tiles').classList.add('hidden');
      $('f-desde').value = ''; $('f-hasta').value = '';
      $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = 'Cargando...';
      $('tx-box').className = 'panel msg'; $('tx-box').textContent = 'Cargando...';
      await cargarDatos();
      if (pollTimer) clearInterval(pollTimer);
      let n = 0;
      pollTimer = setInterval(async () => { n++; await cargarDatos(); if (n >= 12) clearInterval(pollTimer); }, 5000);
    }

    $('volver-btn').addEventListener('click', irAUsuarios);
    $('refresh-btn').addEventListener('click', cargarDatos);
    $('aplicar-btn').addEventListener('click', renderMovimientos);
    $('limpiar-btn').addEventListener('click', () => { $('f-desde').value = ''; $('f-hasta').value = ''; renderMovimientos(); });
    $('exportar-btn').addEventListener('click', exportarCSV);

    async function cargarDatos() {
      const data = await api('/api/admin/usuarios/' + usuarioActual + '/datos');
      if (data.error) { $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = data.error; $('tx-box').textContent = ''; return; }
      datos = data;
      $('detalle-estado').textContent = data.conectado ? 'Banco conectado.' : 'El usuario todavia no conecto su banco.';

      if (!data.accounts.length) {
        $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = 'Sin cuentas todavia.';
      } else {
        let html = '<table><thead><tr><th>Cuenta</th><th>Tipo</th><th>N&deg;</th><th class="num">Saldo</th></tr></thead><tbody>';
        data.accounts.forEach((a) => {
          html += `<tr><td>${a.nombre}</td><td>${a.tipo}</td><td>${a.mask}</td><td class="num">${fmt(a.saldo)} ${a.moneda}</td></tr>`;
        });
        html += '</tbody></table>';
        $('cuentas-box').className = 'panel'; $('cuentas-box').innerHTML = html;
      }
      renderMovimientos();
    }

    function transaccionesFiltradas() {
      const desde = $('f-desde').value, hasta = $('f-hasta').value;
      return datos.transactions.filter((t) => {
        if (desde && t.fecha < desde) return false;
        if (hasta && t.fecha > hasta) return false;
        return true;
      });
    }
    function nombreCuenta(id) { const a = datos.accounts.find((x) => x.id === id); return a ? a.nombre : ''; }

    function renderMovimientos() {
      const txs = transaccionesFiltradas();
      const totalDeb = txs.filter((t) => t.tipo === 'debito').reduce((s, t) => s + t.monto, 0);
      const totalCred = txs.filter((t) => t.tipo === 'credito').reduce((s, t) => s + t.monto, 0);
      const saldoTotal = datos.accounts.reduce((s, a) => s + (a.saldo || 0), 0);

      if (datos.transactions.length || datos.accounts.length) {
        $('tiles').classList.remove('hidden');
        $('tiles').innerHTML = `
          <div class="card tile"><div class="label">Cuentas</div><div class="value">${datos.accounts.length}</div></div>
          <div class="card tile"><div class="label">Saldo total</div><div class="value">${fmt(saldoTotal)}</div></div>
          <div class="card tile"><div class="label">Movimientos</div><div class="value">${txs.length}</div></div>
          <div class="card tile"><div class="label">Debitos</div><div class="value deb">${fmt(totalDeb)}</div></div>
          <div class="card tile"><div class="label">Creditos</div><div class="value cred">${fmt(totalCred)}</div></div>
        `;
      }

      if (!datos.transactions.length) { $('tx-box').className = 'panel msg'; $('tx-box').textContent = 'Sin movimientos todavia.'; return; }
      if (!txs.length) { $('tx-box').className = 'panel msg'; $('tx-box').textContent = 'No hay movimientos en el rango elegido.'; return; }
      let html = '<table><thead><tr><th>Fecha</th><th>Descripcion</th><th>Cuenta</th><th>Tipo</th><th class="num">Monto</th></tr></thead><tbody>';
      txs.forEach((t) => {
        html += `<tr><td>${t.fecha}</td><td>${t.descripcion}</td><td>${nombreCuenta(t.cuenta)}</td><td class="${t.tipo}">${t.tipo}</td><td class="num">${fmt(t.monto)}</td></tr>`;
      });
      html += '</tbody></table>';
      $('tx-box').className = 'panel'; $('tx-box').innerHTML = html;
    }

    function exportarCSV() {
      const txs = transaccionesFiltradas();
      if (!txs.length) { alert('No hay movimientos para exportar en ese rango.'); return; }
      const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const filas = [['Fecha', 'Descripcion', 'Cuenta', 'Tipo', 'Monto']];
      txs.forEach((t) => filas.push([t.fecha, t.descripcion, nombreCuenta(t.cuenta), t.tipo, t.monto.toFixed(2)]));
      const csv = '﻿' + filas.map((f) => f.map(esc).join(',')).join('\r\n');
      const desde = $('f-desde').value || 'inicio', hasta = $('f-hasta').value || 'hoy';
      const nombre = nombreActual.replace(/[^a-z0-9]+/gi, '_');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `movimientos_${nombre}_${desde}_${hasta}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    // ---------- Arranque: sin token de contador, al login unico ----------
    if (token) irAUsuarios(); else alLogin();
  </script>
</body>
</html>
