<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluemaxp - Contador</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg:#ffffff; --ink:#1a1a1c; --muted:#6b7075; --line:#e8e8ec; --panel:#ffffff;
      --accent:#1f3a52; --accent2:#2b5578; --pos:#2f6d4f; --neg:#b0553f; --pend:#9a7b2e;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Archivo',system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    .serif { font-family:'Newsreader',Georgia,serif; }
    .hidden { display:none !important; }
    a { color:var(--accent); } a:hover { color:#142838; }
    .wrap { max-width:940px; margin:0 auto; padding:34px 22px 60px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .spread { justify-content:space-between; }
    .muted { color:var(--muted); font-size:13px; }
    .num { text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); }

    .logo-mark { display:block; flex:none; }
    .brandlock { display:flex; align-items:flex-end; gap:8px; }
    .brandlock .name { font-family:'Newsreader',serif; font-size:23px; font-weight:600; letter-spacing:-0.02em; line-height:1; }
    .tag { font-size:12px; color:var(--accent); background:#e9eef3; border-radius:999px; padding:3px 11px; font-weight:600; align-self:center; }

    .btn-primary { background:linear-gradient(180deg,#2b5578,#1f3a52); color:#f4f6f9; border:none; border-radius:11px; padding:11px 20px; font:600 14px 'Archivo',sans-serif; cursor:pointer;
      box-shadow:0 6px 16px rgba(31,58,82,.28), inset 0 1px 0 rgba(255,255,255,.16); transition:transform .15s, box-shadow .15s, filter .15s; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary:hover { transform:translateY(-1px); filter:brightness(1.07); box-shadow:0 10px 22px rgba(31,58,82,.34); }
    .btn-ghost { background:#fff; border:1px solid #d7d8dd; border-radius:10px; padding:9px 15px; font:500 13px 'Archivo',sans-serif; cursor:pointer; color:var(--ink); box-shadow:0 1px 2px rgba(18,20,28,.06); transition:border-color .15s, box-shadow .15s, transform .15s; display:inline-flex; align-items:center; gap:7px; }
    .btn-ghost:hover { border-color:#c3c5cc; box-shadow:0 5px 14px rgba(18,20,28,.10); transform:translateY(-1px); }
    .btn-link { background:none; border:none; color:var(--accent); padding:0; cursor:pointer; font:14px 'Archivo',sans-serif; text-decoration:underline; }

    .field { padding:11px 13px; font-size:14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:'Archivo',sans-serif; box-shadow:inset 0 1px 2px rgba(28,27,24,.04); transition:border-color .15s, box-shadow .15s; }
    .field:focus { outline:none; border-color:#9db4c8; box-shadow:0 0 0 3px rgba(31,58,82,.12); }
    .search { width:100%; padding:13px 14px 13px 42px; }

    .card { background:linear-gradient(180deg,#ffffff,#fafbfc); border:1px solid #e8e8ec; border-radius:14px; box-shadow:0 1px 2px rgba(18,20,28,.04), 0 12px 30px rgba(18,20,28,.05); }
    .user-card { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; margin-top:12px; }
    .av { width:38px; height:38px; border-radius:50%; background:linear-gradient(145deg,#eaf0f5,#dbe5ef); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; box-shadow:inset 0 1px 0 rgba(255,255,255,.7); flex:none; }
    .av.dark { background:linear-gradient(145deg,#2b5578,#183048); color:#f4f6f9; }
    .badge { font-size:12px; padding:3px 11px; border-radius:999px; font-weight:600; }
    .badge.ok { background:#e3ede7; color:var(--pos); box-shadow:inset 0 0 0 1px rgba(47,109,79,.16); }
    .badge.pend { background:#f3ead2; color:var(--pend); box-shadow:inset 0 0 0 1px rgba(154,123,46,.18); }

    .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(178px,1fr)); gap:14px; margin-top:22px; }
    .tile { padding:16px 18px; min-width:0; }
    .tile .label { font-size:12px; color:var(--muted); }
    .tile .value { font-family:var(--mono); font-size:21px; font-weight:600; margin-top:8px; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .tile .value.deb { color:var(--neg); } .tile .value.cred { color:var(--pos); }

    .panel { background:linear-gradient(180deg,#ffffff,#fafbfc); border:1px solid #e8e8ec; border-radius:14px; padding:6px 16px; margin-top:12px; box-shadow:0 1px 2px rgba(18,20,28,.04), 0 12px 30px rgba(18,20,28,.05); }
    .panel.msg { padding:16px; color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:12px 8px; font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    td { padding:12px 8px; border-top:1px solid var(--line); font-size:14px; }
    .debito { color:var(--neg); } .credito { color:var(--pos); }
    .sectitle { font-family:'Newsreader',serif; font-size:20px; font-weight:600; margin:32px 0 0; }
    .head { display:flex; align-items:center; gap:14px; margin-top:14px; }
    .detalle-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:16px; padding-bottom:22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .filtros { margin-top:12px; gap:10px; }
    .filtros label { font-size:13px; color:var(--muted); }

    /* Tarjetas clickeables */
    .tile.clickable { cursor:pointer; position:relative; transition:transform .12s ease, box-shadow .12s ease; }
    .tile.clickable:hover { transform:translateY(-2px); box-shadow:0 2px 4px rgba(18,20,28,.05), 0 16px 38px rgba(18,20,28,.11); }
    .tile .go { position:absolute; top:14px; right:16px; color:var(--muted); opacity:0; transition:opacity .12s; }
    .tile.clickable:hover .go { opacity:1; }

    /* Cuentas seleccionables (checkboxes) */
    input[type="checkbox"] { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; margin:0; vertical-align:middle; }
    tr.acc-row td { transition:background .12s; }
    tr.acc-row:hover td { background:#f6f7f9; }
    tr.acc-row:has(.chk-acc:checked) td { background:#eef2f6; }
    tr.acc-row td:first-child { width:40px; text-align:center; border-left:3px solid transparent; }
    tr.acc-row:has(.chk-acc:checked) td:first-child { border-left:3px solid var(--accent); }
    #siguiente-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 6px 16px rgba(31,58,82,.18); filter:none; }
    .chip-cuenta { display:inline-flex; align-items:center; gap:9px; background:#eef2f6; color:var(--accent); border-radius:999px; padding:6px 8px 6px 13px; font-size:13px; font-weight:500; }
    .chip-cuenta button { background:none; border:none; color:var(--accent); cursor:pointer; font-size:16px; line-height:1; padding:0 3px; border-radius:50%; }
    .chip-cuenta button:hover { background:#dbe4ee; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(18,20,28,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
    .modal { background:#fff; border:1px solid #e8e8ec; border-radius:18px; width:100%; max-width:560px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px rgba(18,20,28,.28); }
    .modal-head { display:flex; justify-content:space-between; align-items:flex-start; padding:22px 24px 12px; }
    .modal-eyebrow { font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
    .modal-head h3 { font-family:'Newsreader',serif; font-size:26px; font-weight:600; margin:4px 0 0; letter-spacing:-0.01em; }
    .modal-x { background:none; border:none; font-size:24px; line-height:1; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:8px; }
    .modal-x:hover { color:var(--ink); background:#f1f1f3; }
    .modal-controls { display:flex; gap:10px; padding:4px 24px 12px; }
    .modal-searchwrap { position:relative; flex:1; }
    .modal-searchwrap svg { position:absolute; left:13px; top:12px; }
    .modal-controls input { width:100%; padding:11px 12px 11px 40px; border:1px solid var(--line); border-radius:10px; font:14px 'Archivo',sans-serif; box-sizing:border-box; }
    .modal-controls input:focus { outline:none; border-color:#9db4c8; box-shadow:0 0 0 3px rgba(31,58,82,.12); }
    .modal-controls select { border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:14px 'Archivo',sans-serif; background:#fff; cursor:pointer; }
    .modal-summary { padding:0 24px 10px; font-size:13px; color:var(--muted); }
    .modal-list { overflow-y:auto; padding:0 24px 22px; }
    .modal-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
    .modal-row:last-child { border-bottom:none; }
    .modal-row .desc { font-size:14px; }
    .modal-row .sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .modal-row .amt { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ================= LISTA DE USUARIOS ================= -->
    <section id="screen-usuarios" class="hidden">
      <div class="row spread">
        <div class="brandlock">
          <svg class="logo-mark" width="27" height="24" viewBox="0 0 24 24" fill="#1f3a52"><rect x="2" y="13" width="4.6" height="8" rx="2.3"/><rect x="9.7" y="8" width="4.6" height="13" rx="2.3"/><rect x="17.4" y="3" width="4.6" height="18" rx="2.3"/></svg>
          <span class="name">Bluema<span style="color:var(--accent);">x</span>p</span>
          <span class="tag">Contador</span>
        </div>
        <button class="btn-ghost" id="logout-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Salir</button>
      </div>

      <div style="margin-top:30px;">
        <div style="font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);">Panel del contador</div>
        <h1 class="serif" id="saludo-contador" style="font-size:38px; font-weight:500; margin:8px 0 0; letter-spacing:-0.02em; text-transform:capitalize;">Hola</h1>
      </div>

      <div style="position:relative; margin-top:24px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="position:absolute; left:14px; top:14px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="field search" id="buscador" placeholder="Buscar usuario por nombre o email...">
      </div>
      <div style="font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-top:22px;">Tus clientes</div>
      <div id="usuarios-lista"></div>
    </section>

    <!-- ================= DETALLE ================= -->
    <section id="screen-detalle" class="hidden">
      <button class="btn-link" id="volver-btn">&larr; Volver a usuarios</button>
      <div class="detalle-head">
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="av dark" id="detalle-avatar" style="width:52px; height:52px; font-size:22px;"></span>
          <div>
            <h1 class="serif" id="detalle-nombre" style="font-size:30px; font-weight:500; margin:0; letter-spacing:-0.01em; text-transform:capitalize;"></h1>
            <div class="muted" id="detalle-sub" style="margin-top:2px;"></div>
            <div id="detalle-estado" style="margin-top:8px;"></div>
          </div>
        </div>
        <button class="btn-ghost" id="refresh-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
          Actualizar datos
        </button>
      </div>

      <div id="tiles" class="tiles hidden"></div>

      <h3 class="sectitle">Cuentas</h3>
      <div id="cuentas-box" class="panel msg">Sin datos todavia.</div>
      <div id="cuentas-accion" class="hidden" style="display:flex; align-items:center; gap:14px; margin-top:14px;">
        <button class="btn-primary" id="siguiente-btn" disabled>Siguiente
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <span class="muted" id="sel-count"></span>
      </div>

      <div id="movimientos-section" class="hidden">
        <h3 class="sectitle">Movimientos</h3>
        <div id="filtro-cuenta" style="margin:0 0 12px;"></div>
        <div class="row filtros" style="margin-top:0;">
          <label>Desde <input class="field" type="date" id="f-desde"></label>
          <label>Hasta <input class="field" type="date" id="f-hasta"></label>
          <button class="btn-ghost" id="aplicar-btn">Aplicar</button>
          <button class="btn-ghost" id="limpiar-btn">Limpiar</button>
          <button class="btn-primary" id="exportar-btn" style="margin-left:auto;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Exportar CSV</button>
        </div>
        <div id="tx-box" class="panel msg">Sin datos todavia.</div>
      </div>
    </section>

  </div>

  <!-- ================= MODAL ================= -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-eyebrow" id="modal-eyebrow"></div>
          <h3 id="modal-title"></h3>
        </div>
        <button class="modal-x" id="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-controls">
        <div class="modal-searchwrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="modal-search" placeholder="Buscar...">
        </div>
        <select id="modal-sort">
          <option value="desc">Mayor a menor</option>
          <option value="asc">Menor a mayor</option>
        </select>
      </div>
      <div class="modal-summary" id="modal-summary"></div>
      <div class="modal-list" id="modal-list"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('adminToken') || null;
    let usuarioActual = null;
    let nombreActual = '';
    let pollTimer = null;
    let datos = { accounts: [], transactions: [] };
    let cuentasSeleccionadas = new Set(); // marcadas con checkbox (pendiente)
    let cuentasAplicadas = new Set();     // las que muestran los movimientos (tras Siguiente)
    let mostrarMov = false;
    const modalState = {};
    const flecha = '<svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>';

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n == null ? '-' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

    function show(screen) {
      ['screen-usuarios', 'screen-detalle'].forEach((s) => $(s).classList.add('hidden'));
      $(screen).classList.remove('hidden');
    }

    // Si no hay sesion de contador, volvemos al login unico.
    function alLogin() {
      token = null; localStorage.removeItem('adminToken');
      window.location.href = '/';
    }

    async function api(path, opts = {}) {
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(path, opts);
      return res.json();
    }

    $('logout-btn').addEventListener('click', alLogin);

    // ---------- Lista de usuarios ----------
    async function irAUsuarios() {
      if (pollTimer) clearInterval(pollTimer);
      $('saludo-contador').textContent = 'Hola, ' + (localStorage.getItem('adminName') || 'Contador');
      show('screen-usuarios');
      buscarUsuarios();
    }

    let debounce = null;
    $('buscador').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(buscarUsuarios, 250); });

    async function buscarUsuarios() {
      const q = encodeURIComponent($('buscador').value.trim());
      const data = await api('/api/admin/usuarios?q=' + q);
      if (data.error) { alLogin(); return; }
      const cont = $('usuarios-lista');
      cont.innerHTML = '';
      if (!data.usuarios.length) {
        cont.innerHTML = '<p class="muted" style="margin-top:16px;">No hay usuarios que coincidan.</p>';
        return;
      }
      data.usuarios.forEach((u) => {
        const div = document.createElement('div');
        div.className = 'card user-card';
        const badge = u.conectado ? '<span class="badge ok">Conectado</span>' : '<span class="badge pend">Sin banco</span>';
        const inicial = (u.nombre[0] || '?').toUpperCase();
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:14px;">
            <span class="av">${inicial}</span>
            <div>
              <div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:600; font-size:15px; text-transform:capitalize;">${u.nombre}</span> ${badge}</div>
              <div class="muted" style="margin-top:4px;">${u.email} &middot; ${u.cantidadCuentas} cuentas &middot; ${u.cantidadTransacciones} movimientos</div>
            </div>
          </div>
          <button class="btn-ghost">Ver &rarr;</button>
        `;
        div.querySelector('button').addEventListener('click', () => verUsuario(u.id, u.nombre, u.email));
        cont.appendChild(div);
      });
    }

    // ---------- Detalle ----------
    async function verUsuario(id, nombre, email) {
      usuarioActual = id; nombreActual = nombre;
      show('screen-detalle');
      $('detalle-nombre').textContent = nombre;
      $('detalle-sub').textContent = email || '';
      $('detalle-avatar').textContent = (nombre[0] || '?').toUpperCase();
      $('detalle-estado').textContent = '';
      $('tiles').classList.add('hidden');
      cuentasSeleccionadas = new Set(); cuentasAplicadas = new Set(); mostrarMov = false;
      $('cuentas-accion').classList.add('hidden'); $('movimientos-section').classList.add('hidden');
      $('f-desde').value = ''; $('f-hasta').value = '';
      $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = 'Cargando...';
      $('tx-box').className = 'panel msg'; $('tx-box').textContent = 'Cargando...';
      await cargarDatos();
      if (pollTimer) clearInterval(pollTimer);
      let n = 0;
      pollTimer = setInterval(async () => { n++; await cargarDatos(); if (n >= 12) clearInterval(pollTimer); }, 5000);
    }

    $('volver-btn').addEventListener('click', irAUsuarios);
    $('refresh-btn').addEventListener('click', cargarDatos);
    $('aplicar-btn').addEventListener('click', renderMovimientos);
    $('limpiar-btn').addEventListener('click', () => { $('f-desde').value = ''; $('f-hasta').value = ''; renderMovimientos(); });
    $('exportar-btn').addEventListener('click', exportarCSV);

    async function cargarDatos() {
      const data = await api('/api/admin/usuarios/' + usuarioActual + '/datos');
      if (data.error) { $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = data.error; $('tx-box').textContent = ''; return; }
      datos = data;
      $('detalle-estado').innerHTML = data.conectado
        ? '<span class="badge ok">Banco conectado</span>'
        : '<span class="badge pend">Sin banco conectado</span>';

      renderCuentas();
      renderMovimientos();
    }

    function transaccionesFiltradas() {
      const desde = $('f-desde').value, hasta = $('f-hasta').value;
      return datos.transactions.filter((t) => {
        if (desde && t.fecha < desde) return false;
        if (hasta && t.fecha > hasta) return false;
        return true;
      });
    }
    function nombreCuenta(id) { const a = datos.accounts.find((x) => x.id === id); return a ? a.nombre : ''; }

    // Movimientos que ve la tabla: fecha + cuentas aplicadas (tras Siguiente).
    function transaccionesTabla() {
      let txs = transaccionesFiltradas();
      if (cuentasAplicadas.size) txs = txs.filter((t) => cuentasAplicadas.has(t.cuenta));
      return txs;
    }

    // Tabla de cuentas con checkboxes (uno por cuenta + seleccionar todos).
    function renderCuentas() {
      if (!datos.accounts.length) {
        $('cuentas-box').className = 'panel msg'; $('cuentas-box').textContent = 'Sin cuentas todavia.';
        $('cuentas-accion').classList.add('hidden');
        return;
      }
      let html = '<table><thead><tr><th style="width:40px; text-align:center;"><input type="checkbox" id="chk-all"></th><th>Cuenta</th><th>Tipo</th><th>N&deg;</th><th class="num">Saldo</th></tr></thead><tbody>';
      datos.accounts.forEach((a) => {
        const ck = cuentasSeleccionadas.has(a.id) ? ' checked' : '';
        html += `<tr class="acc-row"><td style="text-align:center;"><input type="checkbox" class="chk-acc" data-acc="${a.id}"${ck}></td><td>${a.nombre}</td><td>${a.tipo}</td><td>${a.mask}</td><td class="num">${fmt(a.saldo)} ${a.moneda}</td></tr>`;
      });
      html += '</tbody></table>';
      $('cuentas-box').className = 'panel'; $('cuentas-box').innerHTML = html;
      $('cuentas-accion').classList.remove('hidden');
      actualizarAccion();
    }

    function actualizarAccion() {
      const n = cuentasSeleccionadas.size;
      const total = datos.accounts.length;
      $('siguiente-btn').disabled = n === 0;
      $('sel-count').textContent = n ? (n + ' de ' + total + ' cuentas seleccionadas') : 'Selecciona una o mas cuentas';
      const all = $('chk-all');
      if (all) { all.checked = total > 0 && n === total; all.indeterminate = n > 0 && n < total; }
    }

    function renderMovimientos() {
      const porFecha = transaccionesFiltradas();
      const totalDeb = porFecha.filter((t) => t.tipo === 'debito').reduce((s, t) => s + t.monto, 0);
      const totalCred = porFecha.filter((t) => t.tipo === 'credito').reduce((s, t) => s + t.monto, 0);
      const saldoTotal = datos.accounts.reduce((s, a) => s + (a.saldo || 0), 0);

      if (datos.transactions.length || datos.accounts.length) {
        $('tiles').classList.remove('hidden');
        $('tiles').innerHTML = `
          <div class="card tile clickable" data-tile="cuentas">${flecha}<div class="label">Cuentas</div><div class="value">${datos.accounts.length}</div></div>
          <div class="card tile clickable" data-tile="saldo">${flecha}<div class="label">Saldo total</div><div class="value">${fmt(saldoTotal)}</div></div>
          <div class="card tile clickable" data-tile="movimientos">${flecha}<div class="label">Movimientos</div><div class="value">${porFecha.length}</div></div>
          <div class="card tile clickable" data-tile="debitos">${flecha}<div class="label">Debitos</div><div class="value deb">${fmt(totalDeb)}</div></div>
          <div class="card tile clickable" data-tile="creditos">${flecha}<div class="label">Creditos</div><div class="value cred">${fmt(totalCred)}</div></div>
        `;
      }

      // La seccion de movimientos solo aparece despues de "Siguiente".
      if (!mostrarMov) { $('movimientos-section').classList.add('hidden'); return; }
      $('movimientos-section').classList.remove('hidden');

      const nombres = datos.accounts.filter((a) => cuentasAplicadas.has(a.id)).map((a) => a.nombre);
      $('filtro-cuenta').innerHTML = `<span class="chip-cuenta">${nombres.length} cuenta(s): ${nombres.join(', ')} <button id="cambiar-cuentas" title="Cambiar seleccion">&times;</button></span>`;
      const cb = $('cambiar-cuentas');
      if (cb) cb.addEventListener('click', () => {
        mostrarMov = false;
        $('movimientos-section').classList.add('hidden');
        $('cuentas-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      const txs = transaccionesTabla();
      if (!txs.length) { $('tx-box').className = 'panel msg'; $('tx-box').textContent = 'No hay movimientos con los filtros elegidos.'; return; }
      let html = '<table><thead><tr><th>Fecha</th><th>Descripcion</th><th>Cuenta</th><th>Tipo</th><th class="num">Monto</th></tr></thead><tbody>';
      txs.forEach((t) => {
        html += `<tr><td>${t.fecha}</td><td>${t.descripcion}</td><td>${nombreCuenta(t.cuenta)}</td><td class="${t.tipo}">${t.tipo}</td><td class="num">${fmt(t.monto)}</td></tr>`;
      });
      html += '</tbody></table>';
      $('tx-box').className = 'panel'; $('tx-box').innerHTML = html;
    }

    function exportarCSV() {
      const txs = transaccionesTabla();
      if (!txs.length) { alert('No hay movimientos para exportar con esos filtros.'); return; }
      const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const filas = [['Fecha', 'Descripcion', 'Cuenta', 'Tipo', 'Monto']];
      txs.forEach((t) => filas.push([t.fecha, t.descripcion, nombreCuenta(t.cuenta), t.tipo, t.monto.toFixed(2)]));
      const csv = '﻿' + filas.map((f) => f.map(esc).join(',')).join('\r\n');
      const desde = $('f-desde').value || 'inicio', hasta = $('f-hasta').value || 'hoy';
      const nombre = nombreActual.replace(/[^a-z0-9]+/gi, '_');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `movimientos_${nombre}_${desde}_${hasta}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    // ---------- Seleccion de cuentas (checkboxes) ----------
    $('cuentas-box').addEventListener('change', (e) => {
      if (e.target.id === 'chk-all') {
        cuentasSeleccionadas = new Set();
        if (e.target.checked) datos.accounts.forEach((a) => cuentasSeleccionadas.add(a.id));
        $('cuentas-box').querySelectorAll('.chk-acc').forEach((c) => { c.checked = e.target.checked; });
        actualizarAccion();
      } else if (e.target.classList.contains('chk-acc')) {
        const id = e.target.dataset.acc;
        if (e.target.checked) cuentasSeleccionadas.add(id); else cuentasSeleccionadas.delete(id);
        actualizarAccion();
      }
    });
    // Boton "Siguiente": recien aca aparecen los movimientos de lo seleccionado.
    $('siguiente-btn').addEventListener('click', () => {
      if (!cuentasSeleccionadas.size) return;
      cuentasAplicadas = new Set(cuentasSeleccionadas);
      mostrarMov = true;
      renderMovimientos();
      $('movimientos-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ---------- Modal de detalle de cada tarjeta ----------
    $('tiles').addEventListener('click', (e) => {
      const t = e.target.closest('.tile');
      if (t && t.dataset.tile) abrirModal(t.dataset.tile);
    });
    $('modal-close').addEventListener('click', cerrarModal);
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) cerrarModal(); });
    $('modal-search').addEventListener('input', renderModal);
    $('modal-sort').addEventListener('change', renderModal);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModal(); });

    function abrirModal(tipo) {
      const txs = datos.transactions || [];
      const accs = datos.accounts || [];
      modalState.mixto = false; modalState.signo = ''; modalState.color = '';
      if (tipo === 'cuentas') { modalState.mode = 'acc'; modalState.items = accs; modalState.titulo = 'Cuentas'; modalState.eyebrow = 'Cuentas del cliente'; }
      else if (tipo === 'saldo') { modalState.mode = 'acc'; modalState.items = accs; modalState.titulo = 'Saldo total'; modalState.eyebrow = 'Por cuenta'; }
      else if (tipo === 'debitos') { modalState.mode = 'tx'; modalState.signo = '-'; modalState.color = 'var(--neg)'; modalState.items = txs.filter((t) => t.tipo === 'debito'); modalState.titulo = 'Debitos'; modalState.eyebrow = 'Gastos'; }
      else if (tipo === 'creditos') { modalState.mode = 'tx'; modalState.signo = '+'; modalState.color = 'var(--pos)'; modalState.items = txs.filter((t) => t.tipo === 'credito'); modalState.titulo = 'Creditos'; modalState.eyebrow = 'Ingresos'; }
      else { modalState.mode = 'tx'; modalState.mixto = true; modalState.items = txs.slice(); modalState.titulo = 'Movimientos'; modalState.eyebrow = 'Todos'; }
      $('modal-eyebrow').textContent = modalState.eyebrow;
      $('modal-title').textContent = modalState.titulo;
      $('modal-search').value = '';
      $('modal-sort').value = 'desc';
      $('modal').classList.remove('hidden');
      renderModal();
    }
    function cerrarModal() { $('modal').classList.add('hidden'); }

    function renderModal() {
      const q = $('modal-search').value.trim().toLowerCase();
      const dir = $('modal-sort').value;
      const vacio = '<p style="padding:16px 0; color:var(--muted); font-size:13px;">Sin resultados.</p>';
      let items = (modalState.items || []).slice();

      if (modalState.mode === 'tx') {
        if (q) items = items.filter((t) => (t.descripcion || '').toLowerCase().includes(q) || t.fecha.includes(q) || nombreCuenta(t.cuenta).toLowerCase().includes(q));
        items.sort((a, b) => dir === 'desc' ? b.monto - a.monto : a.monto - b.monto);
        const total = items.reduce((s, t) => s + t.monto, 0);
        $('modal-summary').textContent = items.length + ' movimientos · ' + fmt(total);
        $('modal-list').innerHTML = items.map((t) => {
          const esCred = t.tipo === 'credito';
          const color = modalState.mixto ? (esCred ? 'var(--pos)' : 'var(--neg)') : modalState.color;
          const signo = modalState.mixto ? (esCred ? '+' : '-') : modalState.signo;
          return `<div class="modal-row"><div><div class="desc">${t.descripcion}</div><div class="sub">${t.fecha} · ${nombreCuenta(t.cuenta)}</div></div><div class="amt" style="color:${color}">${signo}${fmt(t.monto)}</div></div>`;
        }).join('') || vacio;
      } else {
        if (q) items = items.filter((a) => (a.nombre || '').toLowerCase().includes(q) || (a.tipo || '').toLowerCase().includes(q));
        items.sort((a, b) => dir === 'desc' ? (b.saldo || 0) - (a.saldo || 0) : (a.saldo || 0) - (b.saldo || 0));
        const total = items.reduce((s, a) => s + (a.saldo || 0), 0);
        $('modal-summary').textContent = items.length + ' cuentas · ' + fmt(total) + ' total';
        $('modal-list').innerHTML = items.map((a) =>
          `<div class="modal-row"><div><div class="desc">${a.nombre}</div><div class="sub">${a.tipo}${a.mask ? ' ·••' + a.mask : ''}</div></div><div class="amt">${fmt(a.saldo)} ${a.moneda || ''}</div></div>`
        ).join('') || vacio;
      }
    }

    // ---------- Arranque: sin token de contador, al login unico ----------
    if (token) irAUsuarios(); else alLogin();
  </script>
</body>
</html>
