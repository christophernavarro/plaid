<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluemax - Panel</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #111; }
    h1 { margin-bottom: 4px; }
    h3 { margin-top: 28px; margin-bottom: 4px; }
    button { padding: 9px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button.link { background: none; border: none; color: #2563eb; padding: 0; text-decoration: underline; }
    input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { color: #555; font-weight: 600; }
    .debito { color: #b91c1c; }
    .credito { color: #15803d; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .badge.ok { background: #dcfce7; color: #15803d; }
    .badge.pend { background: #fef9c3; color: #a16207; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .muted { color: #666; font-size: 13px; }
    .hidden { display: none; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spread { justify-content: space-between; }
    /* Tarjetas de resumen */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
    .tile { border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; }
    .tile .label { font-size: 12px; color: #666; }
    .tile .value { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tile .value.deb { color: #b91c1c; }
    .tile .value.cred { color: #15803d; }
    /* Avatar del cliente */
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #2563eb; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
    .head { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .filtros { margin-top: 12px; gap: 10px; }
    .filtros label { font-size: 13px; color: #555; }
  </style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <section id="screen-login">
    <h1>Bluemax - Panel</h1>
    <p class="muted">Ingresa para administrar tus clientes.</p>
    <div class="row">
      <input id="login-pass" type="password" placeholder="Clave de administrador">
      <button class="primary" id="login-btn">Ingresar</button>
    </div>
    <div id="login-error" class="muted" style="color:#b91c1c"></div>
  </section>

  <!-- ================= LISTA DE CLIENTES ================= -->
  <section id="screen-clientes" class="hidden">
    <div class="row spread">
      <h1>Clientes</h1>
      <button class="link" id="logout-btn">Salir</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="nuevo-nombre" placeholder="Nombre del cliente">
      <input id="nuevo-email" placeholder="Email (opcional)">
      <button class="primary" id="add-btn">Agregar cliente</button>
    </div>
    <input id="buscador" placeholder="Buscar cliente..." style="width:100%;margin-top:12px">
    <div id="clientes-lista"></div>
  </section>

  <!-- ================= DETALLE DE CLIENTE ================= -->
  <section id="screen-detalle" class="hidden">
    <button class="link" id="volver-btn">&larr; Volver a clientes</button>
    <div class="head">
      <span class="avatar" id="detalle-avatar"></span>
      <div>
        <h1 id="detalle-nombre" style="margin:0"></h1>
        <div id="detalle-sub" class="muted"></div>
      </div>
    </div>
    <div id="detalle-estado" class="muted" style="margin-top:8px"></div>

    <div class="row" style="margin-top:12px">
      <button id="link-btn">Generar link para el cliente</button>
      <button id="refresh-btn">Actualizar datos</button>
    </div>
    <div id="link-box" class="muted" style="margin-top:8px"></div>

    <!-- Resumen -->
    <div id="tiles" class="tiles hidden"></div>

    <h3>Cuentas</h3>
    <div id="cuentas-box" class="muted">Sin datos todavia.</div>

    <h3>Movimientos</h3>
    <div class="row filtros">
      <label>Desde <input type="date" id="f-desde"></label>
      <label>Hasta <input type="date" id="f-hasta"></label>
      <button id="aplicar-btn">Aplicar</button>
      <button id="limpiar-btn">Limpiar</button>
      <button class="primary" id="exportar-btn">Exportar CSV</button>
    </div>
    <div id="tx-box" class="muted">Sin datos todavia.</div>
  </section>

  <script>
    let token = localStorage.getItem('adminToken') || null;
    let clienteActual = null;
    let nombreActual = '';
    let pollTimer = null;
    let datosCliente = { accounts: [], transactions: [] }; // ultimo dato cargado
    let clientesCache = [];

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n == null ? '-' : '$' + Number(n).toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

    function show(screen) {
      ['screen-login', 'screen-clientes', 'screen-detalle'].forEach((s) => $(s).classList.add('hidden'));
      $(screen).classList.remove('hidden');
    }

    async function api(path, opts = {}) {
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(path, opts);
      return res.json();
    }

    // ---------- Login ----------
    $('login-btn').addEventListener('click', async () => {
      const password = $('login-pass').value;
      const data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password }) });
      if (data.token) {
        token = data.token;
        localStorage.setItem('adminToken', token);
        $('login-pass').value = '';
        $('login-error').textContent = '';
        irAClientes();
      } else {
        $('login-error').textContent = data.error || 'Error al ingresar';
      }
    });
    $('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });

    $('logout-btn').addEventListener('click', () => {
      token = null;
      localStorage.removeItem('adminToken');
      show('screen-login');
    });

    // ---------- Lista de clientes ----------
    async function irAClientes() {
      if (pollTimer) clearInterval(pollTimer);
      show('screen-clientes');
      const data = await api('/api/clientes');
      if (data.error) { // sesion vencida
        token = null; localStorage.removeItem('adminToken'); show('screen-login'); return;
      }
      clientesCache = data.clientes;
      renderClientes();
    }

    function renderClientes() {
      const filtro = $('buscador').value.trim().toLowerCase();
      const lista = clientesCache.filter((c) =>
        c.nombre.toLowerCase().includes(filtro) || (c.email || '').toLowerCase().includes(filtro));
      const cont = $('clientes-lista');
      cont.innerHTML = '';
      if (!clientesCache.length) {
        cont.innerHTML = '<p class="muted">Todavia no hay clientes. Agrega el primero arriba.</p>';
        return;
      }
      if (!lista.length) {
        cont.innerHTML = '<p class="muted">Ningun cliente coincide con la busqueda.</p>';
        return;
      }
      lista.forEach((c) => {
        const div = document.createElement('div');
        div.className = 'card';
        const badge = c.conectado
          ? '<span class="badge ok">Conectado</span>'
          : '<span class="badge pend">Pendiente</span>';
        div.innerHTML = `
          <div>
            <strong>${c.nombre}</strong> ${badge}<br>
            <span class="muted">${c.email || 'sin email'} &middot; ${c.cantidadCuentas} cuentas &middot; ${c.cantidadTransacciones} movimientos</span>
          </div>
          <button>Ver</button>
        `;
        div.querySelector('button').addEventListener('click', () => verCliente(c.id, c.nombre, c.email));
        cont.appendChild(div);
      });
    }

    $('buscador').addEventListener('input', renderClientes);

    $('add-btn').addEventListener('click', async () => {
      const nombre = $('nuevo-nombre').value.trim();
      const email = $('nuevo-email').value.trim();
      if (!nombre) return;
      await api('/api/clientes', { method: 'POST', body: JSON.stringify({ nombre, email }) });
      $('nuevo-nombre').value = '';
      $('nuevo-email').value = '';
      irAClientes();
    });

    // ---------- Detalle de cliente ----------
    async function verCliente(id, nombre, email) {
      clienteActual = id;
      nombreActual = nombre;
      show('screen-detalle');
      $('detalle-nombre').textContent = nombre;
      $('detalle-sub').textContent = email || 'sin email';
      $('detalle-avatar').textContent = (nombre[0] || '?').toUpperCase();
      $('detalle-estado').textContent = '';
      $('link-box').textContent = '';
      $('tiles').classList.add('hidden');
      $('f-desde').value = '';
      $('f-hasta').value = '';
      $('cuentas-box').textContent = 'Cargando...';
      $('tx-box').textContent = 'Cargando...';
      await cargarDatos();
      // Auto-refresco: mientras Plaid completa los 24 meses en segundo plano.
      if (pollTimer) clearInterval(pollTimer);
      let n = 0;
      pollTimer = setInterval(async () => {
        n++;
        await cargarDatos();
        if (n >= 12) clearInterval(pollTimer); // ~1 min
      }, 5000);
    }

    $('volver-btn').addEventListener('click', irAClientes);

    $('link-btn').addEventListener('click', async () => {
      const data = await api('/api/clientes/' + clienteActual + '/link', { method: 'POST' });
      if (data.url) {
        $('link-box').innerHTML = 'Envia este link al cliente para que conecte su banco:<br>'
          + '<input style="width:100%;margin-top:6px" readonly value="' + data.url + '" onclick="this.select()">';
      }
    });

    $('refresh-btn').addEventListener('click', cargarDatos);
    $('aplicar-btn').addEventListener('click', renderMovimientos);
    $('limpiar-btn').addEventListener('click', () => { $('f-desde').value = ''; $('f-hasta').value = ''; renderMovimientos(); });
    $('exportar-btn').addEventListener('click', exportarCSV);

    async function cargarDatos() {
      const data = await api('/api/clientes/' + clienteActual + '/datos');
      if (data.error) {
        $('cuentas-box').textContent = data.error;
        $('tx-box').textContent = '';
        return;
      }
      datosCliente = data;
      $('detalle-estado').textContent = data.conectado
        ? 'Banco conectado.'
        : 'El cliente todavia no conecto su banco. Genera el link y enviaselo.';

      // Cuentas
      if (!data.accounts.length) {
        $('cuentas-box').textContent = 'Sin cuentas todavia.';
      } else {
        let html = '<table><thead><tr><th>Cuenta</th><th>Tipo</th><th>N&deg;</th><th class="num">Saldo</th></tr></thead><tbody>';
        data.accounts.forEach((a) => {
          html += `<tr><td>${a.nombre}</td><td>${a.tipo}</td><td>${a.mask}</td><td class="num">${fmt(a.saldo)} ${a.moneda}</td></tr>`;
        });
        html += '</tbody></table>';
        $('cuentas-box').innerHTML = html;
      }

      renderMovimientos();
    }

    // Devuelve las transacciones filtradas por el rango de fechas elegido.
    function transaccionesFiltradas() {
      const desde = $('f-desde').value;
      const hasta = $('f-hasta').value;
      return datosCliente.transactions.filter((t) => {
        if (desde && t.fecha < desde) return false;
        if (hasta && t.fecha > hasta) return false;
        return true;
      });
    }

    function nombreCuenta(accountId) {
      const a = datosCliente.accounts.find((x) => x.id === accountId);
      return a ? a.nombre : '';
    }

    function renderMovimientos() {
      const txs = transaccionesFiltradas();

      // Tarjetas de resumen (sobre lo filtrado)
      const totalDeb = txs.filter((t) => t.tipo === 'debito').reduce((s, t) => s + t.monto, 0);
      const totalCred = txs.filter((t) => t.tipo === 'credito').reduce((s, t) => s + t.monto, 0);
      const saldoTotal = datosCliente.accounts.reduce((s, a) => s + (a.saldo || 0), 0);
      if (datosCliente.transactions.length || datosCliente.accounts.length) {
        $('tiles').classList.remove('hidden');
        $('tiles').innerHTML = `
          <div class="tile"><div class="label">Cuentas</div><div class="value">${datosCliente.accounts.length}</div></div>
          <div class="tile"><div class="label">Saldo total</div><div class="value">${fmt(saldoTotal)}</div></div>
          <div class="tile"><div class="label">Movimientos</div><div class="value">${txs.length}</div></div>
          <div class="tile"><div class="label">Debitos (gastos)</div><div class="value deb">${fmt(totalDeb)}</div></div>
          <div class="tile"><div class="label">Creditos (ingresos)</div><div class="value cred">${fmt(totalCred)}</div></div>
        `;
      }

      // Tabla de movimientos
      if (!datosCliente.transactions.length) {
        $('tx-box').textContent = 'Sin movimientos todavia.';
        return;
      }
      if (!txs.length) {
        $('tx-box').textContent = 'No hay movimientos en el rango de fechas elegido.';
        return;
      }
      let html = '<table><thead><tr><th>Fecha</th><th>Descripcion</th><th>Cuenta</th><th>Tipo</th><th class="num">Monto</th></tr></thead><tbody>';
      txs.forEach((t) => {
        html += `<tr><td>${t.fecha}</td><td>${t.descripcion}</td><td>${nombreCuenta(t.cuenta)}</td><td class="${t.tipo}">${t.tipo}</td><td class="num">${fmt(t.monto)}</td></tr>`;
      });
      html += '</tbody></table>';
      $('tx-box').innerHTML = html;
    }

    // ---------- Exportar CSV ----------
    function exportarCSV() {
      const txs = transaccionesFiltradas();
      if (!txs.length) { alert('No hay movimientos para exportar en ese rango.'); return; }

      const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const filas = [['Fecha', 'Descripcion', 'Cuenta', 'Tipo', 'Monto']];
      txs.forEach((t) => filas.push([t.fecha, t.descripcion, nombreCuenta(t.cuenta), t.tipo, t.monto.toFixed(2)]));
      const csv = '﻿' + filas.map((f) => f.map(esc).join(',')).join('\r\n');

      const desde = $('f-desde').value || 'inicio';
      const hasta = $('f-hasta').value || 'hoy';
      const nombre = nombreActual.replace(/[^a-z0-9]+/gi, '_');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `movimientos_${nombre}_${desde}_${hasta}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    // ---------- Arranque ----------
    if (token) irAClientes(); else show('screen-login');
  </script>
</body>
</html>
